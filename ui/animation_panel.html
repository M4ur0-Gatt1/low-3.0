<style>

.cell{width:var(--cell);height:var(--cell);flex:none;border-right:1px solid #24242a;border-bottom:1px solid #24242a;position:relative;text-align:center;font:10px/26px Consolas,monospace;color:var(--mut);cursor:pointer}.cell:hover{background:#26262c}.cell.selected{outline:1px solid rgba(223,108,72,.72);outline-offset:-2px;background:rgba(223,108,72,.12)}.cell.current{box-shadow:inset 1px 0 var(--orange),inset -1px 0 var(--orange);background:#311911;color:#fff}.cell.start{background:var(--cyan);color:#071014}.cell.hold::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid rgba(51,181,232,.55)}.cell.future{opacity:.42}.cell.key::before{content:"◆";color:#ffad32;font-size:7px}.cell.camera::after{content:"●";color:var(--cyan);font-size:7px;position:absolute;bottom:-7px;left:10px}
.xsheet .row{min-height:30px}.xsheet .cell{width:92px;height:30px;line-height:30px}.xsheet .label{width:64px;text-align:right;font-family:Consolas,monospace}.empty{padding:30px;color:var(--mut)}

.lst{display:flex;flex-direction:column}
.lpc{font-size:10px;opacity:.55;min-width:32px;text-align:right}

.lrow:hover{background:var(--hover)}.lrow.sel{background:rgba(223,108,72,.16)}

.lrow input[type=range]::-moz-range-thumb{width:6px;height:12px;border:0;border-radius:2px;background:var(--range-thumb);box-shadow:0 0 0 1px rgba(0,0,0,.24)}
.lrow input[type=range]:hover::-webkit-slider-runnable-track{background:var(--range-track-hover)}.lrow input[type=range]:hover::-webkit-slider-thumb{background:var(--range-thumb-hover)}
.lrow input[type=range]:focus-visible{outline:none}.lrow input[type=range]:focus-visible::-webkit-slider-thumb,.lrow input[type=range]:focus-visible::-moz-range-thumb{background:var(--orange);box-shadow:0 0 0 3px rgba(223,108,72,.16)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;padding:10px}

.tool.on{background:rgba(223,108,72,.18);color:var(--orange)}

.pad{padding:14px;display:flex;flex-direction:column;gap:12px}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px}

</style>

<script>
const KINDS={viewer:'MESA DE DIBUJO',timeline:'TIMELINE',xsheet:'X-SHEET',layers:'CAPAS',tools:'HERRAMIENTAS',color:'COLOR',onion:'PAPEL CEBOLLA',levelstrip:'DIBUJOS DEL NIVEL',rig:'ESQUELETO / CUT-OUT'};
document.querySelectorAll('button[title]').forEach(b=>b.setAttribute('aria-label',b.title));
// el kind llega por FRAGMENTO (#kind=...): sobre file:// la query se pierde

const pedido=(location.hash.match(/kind=([a-z]+)/)||[])[1]

const isAnim=kind==='timeline'||kind==='xsheet';

if(!isAnim){document.querySelectorAll('[data-anim]').forEach(el=>el.style.display='none');document.getElementById('commands').style.display='none'}
let api=null,last='',panelState=null,remoteMode=kind==='xsheet'?'xsheet':'timeline';

document.getElementById('add').onclick=()=>command('add');
document.getElementById('blank').onclick=()=>command('add-blank');
document.getElementById('insert').onclick=e=>command('insert',{blank:e.shiftKey});
document.getElementById('onion').onclick=()=>command('onion');
document.getElementById('key').onclick=()=>command('key');
document.getElementById('camera').onclick=()=>command('camera');
document.getElementById('cameraKey').onclick=()=>command('camera-key');
document.getElementById('tween').onclick=()=>command('tween');
document.getElementById('move').onclick=()=>command('move');
document.getElementById('record').onclick=()=>command('record');
document.getElementById('puppet').onclick=()=>command('puppet');
document.getElementById('walk').onclick=()=>command('walk');
document.getElementById('ai').onclick=()=>command('ai');
document.getElementById('delete').onclick=()=>command('delete');
document.getElementById('audio').onclick=()=>command('audio-load');
document.getElementById('audioMute').onclick=()=>command('audio-mute');
document.getElementById('audioRemove').onclick=()=>command('audio-remove');
document.getElementById('export').onclick=()=>command('export');
document.getElementById('undo').onclick=()=>command('undo');
document.getElementById('redo').onclick=()=>command('redo');
['newDrawing','newLevel','cutCells','copyCells','pasteCells','clearCells','shorter','longer','step1','step2','step3','autoexpose','dedupe','repeatCells','reverseCells','swingCells'].forEach(id=>{
 const actions={newDrawing:'new-drawing',newLevel:'new-level',cutCells:'cut-cells',copyCells:'copy-cells',pasteCells:'paste-cells',clearCells:'clear-cells',shorter:'shorter-exposure',longer:'longer-exposure',step1:'step-1',step2:'step-2',step3:'step-3',autoexpose:'autoexpose',dedupe:'dedupe',repeatCells:'repeat-cells',reverseCells:'reverse-cells',swingCells:'swing-cells'};
 document.getElementById(id).onclick=()=>command(actions[id]);
});
const setRemoteMode=mode=>{remoteMode=mode;last='';if(panelState)paint(panelState)};
document.getElementById('viewTimeline').onclick=()=>setRemoteMode('timeline');
document.getElementById('viewXsheet').onclick=()=>setRemoteMode('xsheet');
document.getElementById('dock').onclick=async()=>{
 // window.close() NO cierra una ventana de pywebview: por eso "Acoplar" no
 // hacía nada. La cierra Python con close_panel(); el window.close() queda
 // como respaldo para cuando el panel se abre en un navegador de pruebas.
 if(api){
  await command('dock',{kind});
  if(api.close_panel){await api.close_panel(kind)}
  else{await (api.panel_closed?api.panel_closed(kind):api.animation_panel_closed(kind))}
 }
 window.close();
};
function cell(frame,classes='',text=''){
 const c=document.createElement('div');c.className='cell '+classes;c.textContent=text;
 c.onclick=e=>command('frame',{index:frame.index,shiftKey:e.shiftKey,ctrlKey:e.ctrlKey||e.metaKey});
 c.ondblclick=e=>{if(!frame.exists)command('create-frame',{index:frame.index,shiftKey:e.shiftKey})};return c;
}
function renderTimeline(s){
 const root=document.createElement('div');root.className='timeline';
 const head=document.createElement('div');head.className='head';head.innerHTML='<div class="label">Niveles ↓ · Fotogramas →</div>';
 const selected=i=>!!s.selection&&i>=s.selection.from&&i<=s.selection.to;
 s.frames.forEach(f=>head.appendChild(cell(f,(f.index===s.current?'current ':'')+(selected(f.index)?'selected ':'')+(f.exists?'':'future'),f.number%5===0||f.index===s.current?f.number:'')));root.appendChild(head);
 const refs=document.createElement('div');refs.className='row references';refs.innerHTML='<div class="label">Referencias de mesa de luz</div>';const fixed=new Set((s.onionFixed||[]).map(Number));s.frames.forEach(f=>{const c=document.createElement('div');c.className='cell '+(f.index===s.current?'current ':'')+(fixed.has(f.number)?(f.index<s.current?'before ':'after '):'')+(f.exists?'':'future');c.title=f.exists?(fixed.has(f.number)?'Quitar referencia del fotograma '+f.number:'Fijar fotograma '+f.number+' como referencia'):'Sin dibujo';if(f.exists&&f.index!==s.current)c.onclick=()=>command('toggle-onion-fixed',{frame:f.number});refs.appendChild(c)});root.appendChild(refs);
 (s.levels||[]).forEach((level,li)=>{const row=document.createElement('div');row.className='row';const label=document.createElement('div');label.className='label';label.textContent=level;row.appendChild(label);let prev=false;s.frames.forEach((f,i)=>{const on=!!(s.exposures[li]&&s.exposures[li][i]);row.appendChild(cell(f,(i===s.current?'current ':'')+(selected(i)?'selected ':'')+(on?(prev?'hold':'start'):'')+(f.exists?'':' future')));prev=on});root.appendChild(row)});
 if(s.frames.some(f=>f.key)){const rig=document.createElement('div');rig.className='row';rig.innerHTML='<div class="label">Esqueleto</div>';s.frames.forEach(f=>rig.appendChild(cell(f,(f.index===s.current?'current ':'')+(selected(f.index)?'selected ':'')+(f.key?'key ':'')+(f.exists?'':'future'))));root.appendChild(rig)}
 const cam=document.createElement('div');cam.className='row';cam.innerHTML='<div class="label">Cámara</div>';s.frames.forEach(f=>cam.appendChild(cell(f,(f.index===s.current?'current ':'')+(selected(f.index)?'selected ':'')+(f.camera?'camera ':'')+(f.exists?'':'future'))));root.appendChild(cam);return root;
}
function renderXsheet(s){
 const root=document.createElement('div');root.className='timeline xsheet';const head=document.createElement('div');head.className='head';head.innerHTML='<div class="label">F</div>'+(s.levels||[]).map(x=>'<div class="cell">'+x.replace(/^#/,'')+'</div>').join('');root.appendChild(head);
 const selected=i=>!!s.selection&&i>=s.selection.from&&i<=s.selection.to;
 s.frames.filter(f=>f.exists).forEach(f=>{const i=f.index,row=document.createElement('div');row.className='row';const label=document.createElement('div');label.className='label';label.textContent=f.number;row.appendChild(label);(s.levels||[]).forEach((level,li)=>{const on=s.exposures[li]&&s.exposures[li][i],prev=i&&s.exposures[li]&&s.exposures[li][i-1];row.appendChild(cell(f,(i===s.current?'current ':'')+(selected(i)?'selected ':'')+(on?(prev?'hold':'start'):''),on&&!prev?f.number:''))});root.appendChild(row)});return root;
}
function renderLayers(s){
 const root=document.createElement('div');root.className='timeline lst';
 (s.layers||[]).forEach(l=>{
  const row=document.createElement('div');row.className='lrow'+(l.selected?' sel':'');
  const eye=document.createElement('button');eye.className='mini';eye.textContent=l.hidden?'◌':'◉';
  eye.title=l.hidden?'Mostrar':'Ocultar';if(l.hidden)eye.style.opacity='.4';
  eye.onclick=e=>{e.stopPropagation();command('visible',{id:l.id})};
  const lock=document.createElement('button');lock.className='mini';lock.textContent=l.locked?'◼':'◻';
  lock.title=l.locked?'Desbloquear':'Bloquear';if(!l.locked)lock.style.opacity='.35';
  lock.onclick=e=>{e.stopPropagation();command('lock',{id:l.id})};
  const name=document.createElement('span');name.className='lname';name.textContent=l.name;
  const op=document.createElement('input');op.type='range';op.min=0;op.max=100;op.value=l.opacity;
  op.title='Opacidad '+l.opacity+'%';op.oninput=e=>{e.stopPropagation();command('opacity',{id:l.id,value:+e.target.value})};
  const pc=document.createElement('span');pc.className='lpc';pc.textContent=l.opacity+'%';
  row.append(eye,lock,name,op,pc);row.onclick=()=>command('select',{id:l.id});root.appendChild(row)});

}
function renderTools(s){
 const root=document.createElement('div');root.className='timeline grid';
 (s.tools||[]).forEach(t=>{const b=document.createElement('button');
  b.className='tool'+(t.active?' on':'');b.title=t.label;
  // icono cuando el simbolo existe en el sprite; el texto queda de respaldo
  // para que una herramienta nueva nunca aparezca como un boton vacio
  if(t.icon&&document.getElementById(t.icon))
   b.innerHTML='<svg class="ico'+(t.fill?' ico-fill':'')+'" aria-hidden="true"><use href="#'+t.icon+'"/></svg>';
  else b.textContent=t.label;
  b.setAttribute('aria-label',t.label);
  b.onclick=()=>command('tool',{id:t.id});root.appendChild(b)});

}
function renderColor(s){
 const root=document.createElement('div');root.className='timeline pad';
 if(!s.hasSelection){root.innerHTML='<div class="empty">Elegí un elemento en el lienzo</div>';return root}
 const fila=(txt,inp)=>{const d=document.createElement('div');d.className='frow';
  const l=document.createElement('label');l.textContent=txt;d.append(l,inp);return d};
 const f=document.createElement('input');f.type='color';f.value=s.fill||'#000000';
 f.oninput=e=>command('fill',{value:e.target.value});
 const st=document.createElement('input');st.type='color';st.value=s.stroke||'#000000';
 st.oninput=e=>command('stroke',{value:e.target.value});

function renderLevelStrip(s){
 const root=document.createElement('div');root.className='timeline levelstrip';
 const head=document.createElement('div');head.className='levelstrip-head';
 head.innerHTML='<b></b><span></span>';head.querySelector('b').textContent=s.level||'Sin nivel';

 const grid=document.createElement('div');grid.className='drawing-grid';
 (s.drawings||[]).forEach(d=>{const b=document.createElement('button');
  b.className='drawing-card'+(d.number===s.current?' on':'')+(d.selected?' selected':'')+(d.exposed?'':' loose');
  b.title=d.exposed?'Dibujo '+d.number+' · clic: ir al fotograma · doble clic: exponer aquí':'Dibujo '+d.number+' sin exponer · doble clic: exponer aquí';
  const thumb=document.createElement('span');thumb.className='drawing-thumb'+(d.empty||!d.content?' empty':'');
  if(d.content){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
   svg.setAttribute('viewBox','0 0 '+(+s.width||1020)+' '+(+s.height||1080));svg.setAttribute('preserveAspectRatio','xMidYMid meet');svg.innerHTML=d.content;thumb.appendChild(svg)}
  const meta=document.createElement('span');meta.className='drawing-meta';const num=document.createElement('b');num.textContent=d.number;
  const state=document.createElement('span');state.textContent=d.exposed?'Expuesto':'Sin exponer';meta.append(num,state);b.append(thumb,meta);
  b.onclick=e=>command('drawing',{number:d.number,ctrlKey:e.ctrlKey||e.metaKey,shiftKey:e.shiftKey});
  b.ondblclick=e=>{e.preventDefault();command('expose-drawing',{number:d.number})};grid.appendChild(b)});
 if(!(s.drawings||[]).length)grid.innerHTML='<div class="empty">El nivel todavía no tiene dibujos</div>';root.appendChild(grid);return root;

/* PAPEL CEBOLLA en su propia ventana: los mismos controles que adentro, para
   dejarlo abierto en el segundo monitor mientras se dibuja en el primero. */
function renderOnion(s){
 const root=document.createElement('div');root.className='timeline';
 if(!s||!s.cfg){root.innerHTML='<div class="empty">Abrí una animación en LOW</div>';return root}
 const c=s.cfg,slots=10;
 const profile=side=>{const key=side==='before'?'beforeOpacity':'afterOpacity';if(Array.isArray(c[key]))return Array.from({length:slots},(_,i)=>Math.max(0,Math.min(1,+c[key][i]||0)));const count=+c[side]||0;return Array.from({length:slots},(_,i)=>i<count?(+c.alpha||.38)*Math.pow(+c.falloff||.55,i):0)};
 const mixer=document.createElement('div');mixer.className='onion-mixer';
 const channel=(side,distance,value,color,label)=>{const wrap=document.createElement('div');wrap.className='onion-channel';const l=document.createElement('label');l.textContent=label;const input=document.createElement('input');input.type='range';input.min=0;input.max=100;input.value=Math.round(value*100);input.style.setProperty('--channel',color);const out=document.createElement('output');out.textContent=input.value+'%';input.oninput=()=>{out.textContent=input.value+'%';command('onion-mixer',{side,distance,value:+input.value/100,live:true})};input.onchange=()=>command('onion-mixer',{side,distance,value:+input.value/100});wrap.append(l,input,out);mixer.appendChild(wrap)};
 const before=profile('before'),after=profile('after');for(let d=slots;d>=1;d--)channel('before',d,before[d-1],c.colorBefore,'−'+d);
 const current=document.createElement('div');current.className='onion-channel current';current.innerHTML='<label>0</label><i></i><output>actual</output>';mixer.appendChild(current);

 const color=(label,value,key)=>{const l=document.createElement('label'),input=document.createElement('input');input.type='color';input.value=value;input.oninput=()=>command('onion',{key,value:input.value});l.append(input,document.createTextNode(label));return l};
 controls.append(color('Anteriores',c.colorBefore,'colorBefore'));
 ['curve','flat','clear'].forEach((id,i)=>{const b=document.createElement('button');b.className='tool';b.textContent=['Curva','Uniforme','Limpiar'][i];b.onclick=()=>command('onion-preset',{kind:id});controls.appendChild(b)});
 controls.append(color('Posteriores',c.colorAfter,'colorAfter'));
 const on=document.createElement('button');on.className='tool'+(s.enabled?' on':'');
 on.textContent=s.enabled?'Activado':'Desactivado';
 on.onclick=()=>command('onion',{key:'enabled',value:!s.enabled});
 controls.appendChild(on);
 const lines=document.createElement('button');lines.className='tool'+(c.linesOnly?' on':'');lines.textContent='Solo línea';lines.onclick=()=>command('onion',{key:'linesOnly',value:!c.linesOnly});controls.appendChild(lines);
 const fixed=document.createElement('button');fixed.className='tool';fixed.textContent=(c.fixed||[]).includes(s.frame)?'Quitar fijo actual':'Fijar actual';fixed.onclick=()=>command('onion-fixed',{frame:s.frame});controls.appendChild(fixed);
 (c.fixed||[]).forEach(frame=>{const b=document.createElement('button');b.className='mini';b.textContent='F'+frame+' ×';b.title='Quitar referencia fija';b.onclick=()=>command('onion-fixed',{frame});controls.appendChild(b)});
 root.appendChild(controls);
 return root;
}
function renderRig(s){
 const root=document.createElement('div');root.className='rigdesk';
 const modes=document.createElement('div');modes.className='rig-modes';
 [['build','Armado'],['fk','FK'],['ik','IK']].forEach(([id,label])=>{const b=document.createElement('button');b.textContent=label;b.className=s.mode===id?'on':'';b.onclick=()=>command('mode',{mode:id});modes.appendChild(b)});root.appendChild(modes);
 const library=document.createElement('section');library.className='rig-card';library.innerHTML='<header><b>Biblioteca</b><span>adaptable</span></header>';
 const librow=document.createElement('div');librow.className='rig-actions';const sel=document.createElement('select');sel.innerHTML='<option value="human_standard">Humano · completo</option><option value="human_simple">Humano · stickman</option><option value="human_chibi">Humano · chibi</option><option value="dog">Perro</option><option value="cat">Gato</option><option value="horse">Caballo</option><option value="face_pro">Rostro · controles profesionales</option>';const add=document.createElement('button');add.className='primary';add.textContent='Colocar';add.title='Colocar esqueleto en la mesa principal';add.onclick=()=>command('rig-library',{key:sel.value});librow.append(sel,add);library.appendChild(librow);root.appendChild(library);
 const byId=Object.fromEntries((s.nodes||[]).map(n=>[n.id,n])),selected=byId[s.selected]||(s.nodes||[]).find(n=>n.selected)||null;
 const card=document.createElement('section');card.className='rig-card';card.innerHTML='<header><b>Jerarquía</b><span></span></header>';card.querySelector('header span').textContent=(s.nodes||[]).length+' piezas';
 const tree=document.createElement('div');tree.className='rig-tree';
 const branch=(node,depth)=>{const row=document.createElement('div');row.className='rig-node'+(!node.parentId?' root':'')+(selected&&selected.id===node.id?' on':'');row.style.paddingLeft=(9+depth*15)+'px';row.innerHTML='<i></i><span></span><small></small>';row.querySelector('span').textContent=node.id;row.querySelector('small').textContent=node.pinned?'fija':(node.keyed?'clave':'');row.onclick=()=>command('select-node',{id:node.id});tree.appendChild(row);(s.nodes||[]).filter(n=>n.parentId===node.id).forEach(n=>branch(n,depth+1))};
 (s.nodes||[]).filter(n=>!n.parentId||!byId[n.parentId]).forEach(n=>branch(n,0));if(!(s.nodes||[]).length)tree.innerHTML='<div class="empty">Registrá las piezas desde la mesa principal.</div>';card.appendChild(tree);root.appendChild(card);
 if(selected){const pose=selected.pose||{},pcard=document.createElement('section');pcard.className='rig-card';pcard.innerHTML='<header><b>Pose actual</b><span></span></header>';pcard.querySelector('header span').textContent='F'+(s.frame||1);
  const form=document.createElement('div');form.className='rig-form';const fields=[['X','x',pose.x||0,1],['Y','y',pose.y||0,1],['Rot','r',pose.r||0,1],['Esc X','sx',pose.sx==null?1:pose.sx,.05],['Esc Y','sy',pose.sy==null?1:pose.sy,.05],['Lím min','min',selected.limits?.min??-180,1],['Lím máx','max',selected.limits?.max??180,1]];const inputs={};
  fields.forEach(([label,key,value,step])=>{const l=document.createElement('label'),i=document.createElement('input');i.type='number';i.step=step;i.value=Math.round(value*100)/100;inputs[key]=i;l.append(document.createTextNode(label),i);form.appendChild(l)});pcard.appendChild(form);
  const poseValue=()=>({x:+inputs.x.value||0,y:+inputs.y.value||0,r:+inputs.r.value||0,sx:+inputs.sx.value||1,sy:+inputs.sy.value||1});['x','y','r','sx','sy'].forEach(key=>inputs[key].onchange=()=>command('pose',{id:selected.id,pose:poseValue()}));const limits=()=>command('limits',{id:selected.id,min:+inputs.min.value,max:+inputs.max.value});inputs.min.onchange=limits;inputs.max.onchange=limits;
  const actions=document.createElement('div');actions.className='rig-actions';const add=(label,action,payload,primary)=>{const b=document.createElement('button');b.textContent=label;if(primary)b.className='primary';b.onclick=()=>command(action,payload);actions.appendChild(b)};add(selected.keyed?'Actualizar clave':'Crear clave','key',{id:selected.id,pose:poseValue()},true);add('Clave global','key-all',{});add('Borrar clave','delete-key',{id:selected.id});add(selected.pinned?'Liberar raíz':'Fijar raíz','pin',{id:selected.id});pcard.appendChild(actions);root.appendChild(pcard);
  const mid=selected.parentId&&byId[selected.parentId],chainRoot=mid?.parentId&&byId[mid.parentId];if(chainRoot){const create=document.createElement('div');create.className='rig-actions';const b=document.createElement('button');b.className='primary';b.textContent='Crear IK '+chainRoot.id+' → '+selected.id;b.onclick=()=>command('create-ik',{rootId:chainRoot.id,midId:mid.id,effectorId:selected.id});create.appendChild(b);root.appendChild(create)}}
 const ik=document.createElement('section');ik.className='rig-card';ik.innerHTML='<header><b>Cadenas IK</b><span></span></header>';ik.querySelector('header span').textContent=(s.constraints||[]).length;
 const list=document.createElement('div');list.className='rig-constraints';(s.constraints||[]).forEach(c=>{const row=document.createElement('div');row.className='rig-chain'+((s.activeConstraint===c.id||c.active)?' on':'');const name=document.createElement('span');name.textContent=c.rootId+' → '+c.effectorId;name.onclick=()=>command('constraint',{id:c.id});const flip=document.createElement('button');flip.textContent='↔';flip.title='Invertir flexión';flip.onclick=e=>{e.stopPropagation();command('flip-ik',{id:c.id})};const del=document.createElement('button');del.textContent='×';del.title='Eliminar IK';del.onclick=e=>{e.stopPropagation();command('delete-ik',{id:c.id})};row.append(name,flip,del);list.appendChild(row)});if(!(s.constraints||[]).length)list.innerHTML='<div class="empty">Elegí un extremo con dos antecesores para crear IK.</div>';ik.appendChild(list);root.appendChild(ik);
 const help=document.createElement('div');help.className='rig-help';help.textContent=s.mode==='ik'?'Arrastrá el rombo del objetivo en la mesa de dibujo. LOW crea las claves de ambos huesos en una sola operación.':s.mode==='fk'?'Arrastrá una pieza para trasladarla; Shift+arrastrar rota desde su articulación.':'Armado: registrá piezas, ubicá pivotes y vinculá cada pieza con su padre.';root.appendChild(help);return root;
}
let viewerState=null,viewerTool='pencil';
function viewerPoint(e,host,state){
 const vb=(state.viewBox||'0 0 1020 1080').trim().split(/[ ,]+/).map(Number),r=host.getBoundingClientRect();
 const scale=Math.min(r.width/vb[2],r.height/vb[3]),w=vb[2]*scale,h=vb[3]*scale;
 return [vb[0]+(e.clientX-r.left-(r.width-w)/2)/scale,vb[1]+(e.clientY-r.top-(r.height-h)/2)/scale,e.pressure||.5];
}
function renderViewer(s){
 viewerState=s;const root=document.createElement('div');root.className='viewerdesk';
 root.innerHTML=s.svg||'<div class="empty">Abrí un dibujo en LOW</div>';
 const svg=root.querySelector('svg');if(svg){svg.removeAttribute('width');svg.removeAttribute('height');
  ['transform','width','height','max-width','max-height','aspect-ratio'].forEach(p=>svg.style.removeProperty(p));
  if(!svg.getAttribute('style'))svg.removeAttribute('style');svg.setAttribute('preserveAspectRatio','xMidYMid meet')}
 const rig=s.rig;if(svg&&rig&&rig.visible&&(rig.nodes||[]).length){const ns='http://www.w3.org/2000/svg',over=document.createElementNS(ns,'svg');over.classList.add('rig-view-overlay');over.setAttribute('viewBox',s.viewBox||'0 0 1020 1080');over.setAttribute('preserveAspectRatio','xMidYMid meet');const byId=Object.fromEntries(rig.nodes.map(n=>[n.id,n]));const add=(tag,a,cl)=>{const el=document.createElementNS(ns,tag);Object.entries(a||{}).forEach(([k,v])=>el.setAttribute(k,v));if(cl)el.setAttribute('class',cl);over.appendChild(el);return el};rig.nodes.forEach(n=>{const a=n.parentId&&byId[n.parentId]?.worldPivot,b=n.worldPivot;if(a&&b)add('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y})});rig.nodes.forEach(n=>{const p=n.worldPivot;if(!p)return;const c=add('circle',{cx:p.x,cy:p.y,r:n.pinned?7:5},(n.pinned?'root ':'')+(n.selected?'selected':''));c.onpointerdown=e=>{e.preventDefault();e.stopPropagation();command('rig-select',{id:n.id})}});(rig.constraints||[]).forEach(c=>{if(!c.target)return;const d=(x,y)=>'M'+x+' '+(y-9)+'L'+(x+9)+' '+y+'L'+x+' '+(y+9)+'L'+(x-9)+' '+y+'Z';const t=add('path',{d:d(c.target.x,c.target.y)});t.onpointerdown=e=>{e.preventDefault();e.stopPropagation();const move=ev=>{const p=viewerPoint(ev,root,s);t.setAttribute('d',d(p[0],p[1]))};const up=ev=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);const p=viewerPoint(ev,root,s);command('rig-target',{id:c.id,x:p[0],y:p[1]})};document.addEventListener('pointermove',move);document.addEventListener('pointerup',up)}});root.appendChild(over)}
 let pts=[],live=null;
 root.onpointerdown=e=>{if(e.button!==0||viewerTool==='hand')return;e.preventDefault();root.setPointerCapture(e.pointerId);pts=[viewerPoint(e,root,viewerState)];
  if(svg){live=document.createElementNS('http://www.w3.org/2000/svg','path');live.classList.add('live');live.setAttribute('fill','none');live.setAttribute('stroke',s.color||'#111');live.setAttribute('stroke-width',s.width||6);live.setAttribute('stroke-linecap','round');svg.appendChild(live)}};
 root.onpointermove=e=>{if(!pts.length)return;pts.push(viewerPoint(e,root,viewerState));if(live)live.setAttribute('d',pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(2)+' '+p[1].toFixed(2)).join(' '))};
 const finish=e=>{if(!pts.length)return;pts.push(viewerPoint(e,root,viewerState));command('stroke',{points:pts,color:s.color,width:s.width,tool:viewerTool});pts=[];live=null};
 root.onpointerup=finish;root.onpointercancel=()=>{pts=[];if(live)live.remove();live=null};return root;
}
function renderFor(s){
 if(kind==='viewer')return renderViewer(s);
 if(kind==='layers')return renderLayers(s);
 if(kind==='tools')return renderTools(s);
 if(kind==='color')return renderColor(s);
 if(kind==='onion')return renderOnion(s);
 if(kind==='levelstrip')return renderLevelStrip(s);
 if(kind==='rig')return renderRig(s);
 return remoteMode==='xsheet'?renderXsheet(s):renderTimeline(s);
}
if(isViewer){
 const tools=document.createElement('div');tools.className='viewer-tools';
 [['pencil','Lápiz'],['brush','Pincel']].forEach(([id,label])=>{const b=document.createElement('button');b.textContent=label;b.className=id===viewerTool?'on':'';b.onclick=()=>{viewerTool=id;tools.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));command('tool',{id})};tools.appendChild(b)});
 const undo=document.createElement('button');undo.textContent='↶';undo.title='Deshacer';undo.onclick=()=>command('undo');tools.appendChild(undo);
 const redo=document.createElement('button');redo.textContent='↷';redo.title='Rehacer';redo.onclick=()=>command('redo');tools.appendChild(redo);
 document.querySelector('.top').insertBefore(tools,document.querySelector('.spacer'));
}
function active(id,on){const el=document.getElementById(id);if(el)el.classList.toggle('on',!!on)}
function paint(s){
 panelState=s||{};
 if(isAnim){
  const count=s.frames?s.frames.filter(f=>f.exists).length:0;
  document.getElementById('fps').textContent=count+' fotogramas';
  document.getElementById('play').textContent=s.playing?'Ⅱ':'▶';
  [['fpsInput',s.fps||12],['rangeIn',s.rangeIn||1],['rangeOut',s.rangeOut||0]].forEach(([id,value])=>{const el=document.getElementById(id);if(document.activeElement!==el)el.value=value});
  active('loop',s.loop);active('onion',s.onion);active('key',s.currentKey);
  active('camera',s.cameraMode);active('cameraKey',s.currentCamera);
  active('move',s.moving);active('record',s.recording);active('puppet',s.puppeteering);
  active('viewTimeline',remoteMode==='timeline');active('viewXsheet',remoteMode==='xsheet');
  const audio=document.getElementById('audio'),mute=document.getElementById('audioMute'),remove=document.getElementById('audioRemove');
  audio.textContent=s.audio?(s.audio.name||'Audio'):'Audio';audio.title=s.audio?'Pista: '+(s.audio.name||'Audio'):'Cargar una pista de audio';
  mute.disabled=!s.audio;remove.disabled=!s.audio;active('audioMute',s.audio&&s.audio.muted);
 }
 const content=document.getElementById('content'),next=renderFor(s);next.id='content';content.replaceWith(next);
}
async function refresh(){if(!api)return;try{const s=await (api.panel_state?api.panel_state(kind):api.animation_panel_state());const key=JSON.stringify(s);if(key===last)return;if(document.activeElement&&['INPUT','SELECT'].includes(document.activeElement.tagName))return;last=key;paint(s)}catch(e){}}
window.addEventListener('pywebviewready',()=>{api=window.pywebview.api;refresh();setInterval(refresh,350)});
